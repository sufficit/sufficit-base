name: Publish Packages

on:
  push:
    branches: [ main ]    
  # Permite rodar so a sonda de Trusted Publishing (job verify-auth)
  # sem publicar nada.
  workflow_dispatch:

jobs:
  # Sonda de Trusted Publishing: so roda em workflow_dispatch e NAO publica
  # nada. Confere se a policy no nuget.org continua casando com este workflow
  # (owner=sufficit, repo, publish.yml) emitindo credencial temporaria.
  verify-auth:
    if: github.event_name == 'workflow_dispatch'
    runs-on: aireset-ci
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Verify NuGet policy creator is configured
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          test -n "$NUGET_USER" || { echo "Set Actions variable NUGET_USER to the NuGet username that created the trust policy (not the package owner)." >&2; exit 1; }
      - name: Authenticate with NuGet using GitHub OIDC
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Verify temporary credential was issued
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: test -n "$NUGET_API_KEY"

  publish:
    # Em workflow_dispatch roda apenas a sonda acima; publicacao
    # continua exclusivamente no push para main.
    if: github.event_name == 'push'
    runs-on: aireset-ci

    permissions:
      contents: read
      # Necessário para o GitHub emitir o token OIDC trocado por uma API key
      # temporária (1h) no nuget.org — Trusted Publishing.
      id-token: write

    env:
      SRC_DIR: ./src
      NUPKGS_DIR: ${{ github.workspace }}/src/nupkgs
      LEGACY_DOTNET_SDK_VERSION: 2.2.402
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
      
    - name: Setup .NET Environment
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          7.0.x
          9.0.x
          10.0.x
                
    - name: Install legacy .NET Core SDK 2.2.x
      shell: bash
      run: |
        curl -fsSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
        bash "$RUNNER_TEMP/dotnet-install.sh" \
          --version "${LEGACY_DOTNET_SDK_VERSION}" \
          --install-dir "$RUNNER_TEMP/dotnet-legacy-2.2" \
          --no-path

    - name: Show installed SDKs
      shell: bash
      run: |
        dotnet --list-sdks
        "$RUNNER_TEMP/dotnet-legacy-2.2/dotnet" --list-sdks

    - name: Install dependencies
      working-directory: ${{ env.SRC_DIR }}
      run: dotnet restore
      
    - name: Build
      working-directory: ${{ env.SRC_DIR }}
      run: dotnet build --configuration Packing
      
    - name: Deploy Package 
      working-directory: ${{ env.SRC_DIR }}
      run: dotnet pack --configuration Packing --output ${{ env.NUPKGS_DIR }}
    
    # Trusted Publishing (OIDC): a policy no nuget.org está registrada para
    # Repository Owner=sufficit, Repository=sufficit-base, Workflow=publish.yml,
    # glob Sufficit.Base. O GitHub emite um token OIDC curto, o nuget.org troca
    # por uma API key temporária (validade 1h) — nenhuma chave de longa duração
    # fica guardada em secret. Por isso este workflow NÃO usa NUGET_API_KEY.
    #
    # vars.NUGET_USER = usuário nuget.org QUE CRIOU a policy (não o owner do
    # pacote). Mesmo padrão já em produção no sufficit-blazor-ui.
    - name: Verify NuGet policy creator is configured
      env:
        NUGET_USER: ${{ vars.NUGET_USER }}
      run: |
        test -n "$NUGET_USER" || { echo "Set Actions variable NUGET_USER to the NuGet username that created the trust policy (not the package owner)." >&2; exit 1; }

    - name: Authenticate with NuGet using GitHub OIDC
      id: login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
      with:
        user: ${{ vars.NUGET_USER }}

    - name: Publish to Nuget.Org
      working-directory: ${{ env.SRC_DIR }}
      run: dotnet nuget push --skip-duplicate ${{ env.NUPKGS_DIR }}/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }}

    # GitHub Packages disabled - only NuGet.org is used
    # - name: Publish to GitHub
    # working-directory: ${{ env.SRC_DIR }}
    # run: dotnet nuget push --skip-duplicate ${{ env.NUPKGS_DIR }}/*.nupkg --source https://nuget.pkg.github.com/${{github.repository_owner}}/index.json --api-key ${{github.token}}
    # # The 'continue-on-error: true' ensures that if this step fails (e.g., due to quota limits),
    # # the overall workflow will still succeed, allowing other steps/jobs to complete.
    # # This makes the GitHub package publishing optional in terms of workflow success.
    # continue-on-error: ${{ env.GITHUBPACKAGEISREQUIRED != 'true' }}
    
